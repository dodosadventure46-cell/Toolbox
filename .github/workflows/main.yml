name: Build MCPE Toolbox APK (Auto-Extract & Zero-Fail)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Auto-Extract & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Extract ZIP (Tanpa Perlu Ekstrak di HP) & Fail-Safe Generator
        shell: bash
        run: |
          set -e
          echo "=== Memeriksa struktur file proyek ==="
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Menemukan file ZIP: $ZIP_FILE -> Mengekstrak otomatis di server GitHub..."
              unzip -o "$ZIP_FILE" -d .
            else
              echo "Tidak ada file ZIP di repo -> Mengekstrak proyek bawaan dari dalam build-apk.yml..."
              echo "" | base64 -d > _auto_project.zip
              unzip -o _auto_project.zip -d .
              rm -f _auto_project.zip
            fi
          fi

          # Jika hasil ekstrak berada di dalam subfolder (misal MCPEToolboxLauncher/), pindahkan ke root
          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
            if [ -n "$SUBDIR_SETTINGS" ]; then
              PROJ_DIR=$(dirname "$SUBDIR_SETTINGS")
              echo "Memindahkan isi proyek dari $PROJ_DIR ke root workspace..."
              cp -rn "$PROJ_DIR"/* . || true
            fi
          fi

          ls -la
          test -f "settings.gradle.kts"
          test -f "app/build.gradle.kts"
          echo "=== Struktur proyek siap di-build! ==="

      - name: 3. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Auto-Accept Android SDK Licenses & Link Pre-installed NDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 5. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 6. Compile C++ NDK & Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 7. Upload APK ke GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MCPEToolboxLauncher-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
